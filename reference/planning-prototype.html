<title>햇살병원 방사선과</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: a small hospital floor seen from above — four rooms in a 2x2 grid that patients move through, a status bar on top, sheets slide up from the bottom. */
:root {
  --bg: #e7efec;
  --panel: #ffffff;
  --ink: #1c2a2e;
  --muted: #64757a;
  --line: #d3dedb;
  --accent: #1d7686;
  --accent-ink: #ffffff;
  --gold: #c9951a;
  --good: #339060;
  --warn: #c98a12;
  --bad: #cf5248;
  --r-wait: #f7efe1;
  --r-ct: #e4edf8;
  --r-plan: #eee8f6;
  --r-treat: #e2f2ea;
  --viewer: #0d1315;
  --ct-body: #8c9897; --ct-soft2: #7c8988; --ct-lung: #2c3639; --ct-bone: #e9e6dc; --ct-fluid: #5d6c74;
  --s-ptv: #ff5b4f; --s-cord: #f4c430; --s-heart: #e070bd; --s-lung: #5ec0e2;
  --f-disp: "Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101719; --panel: #182326; --ink: #e3ecea; --muted: #94a5a8; --line: #2a3b3f;
    --accent: #3fb2c2; --accent-ink: #0d1a1d; --gold: #e2b545; --good: #55b982; --warn: #dea43c; --bad: #e86d62;
    --r-wait: #262219; --r-ct: #182330; --r-plan: #211c2c; --r-treat: #16271f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101719; --panel: #182326; --ink: #e3ecea; --muted: #94a5a8; --line: #2a3b3f;
  --accent: #3fb2c2; --accent-ink: #0d1a1d; --gold: #e2b545; --good: #55b982; --warn: #dea43c; --bad: #e86d62;
  --r-wait: #262219; --r-ct: #182330; --r-plan: #211c2c; --r-treat: #16271f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 0 24px; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
@media (min-width: 380px) { body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
.app { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.disp { font-family: var(--f-disp); font-weight: 400; }
.tab { font-variant-numeric: tabular-nums; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 4px; display: flex; flex-direction: column; gap: 8px; }
.bar1 { display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--f-disp); font-size: 19px; line-height: 1; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { font-family: var(--f-body); font-size: 11px; color: var(--muted); display: block; margin-top: 3px; }
.speed { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.speed button { border: 0; background: transparent; padding: 6px 10px; font-size: 12px; cursor: pointer; min-width: 36px; }
.speed button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.iconbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; min-width: 0; }
.stat span { display: block; font-size: 10.5px; color: var(--muted); letter-spacing: .02em; }
.stat b { font-family: var(--f-disp); font-weight: 400; font-size: 17px; white-space: nowrap; }
.stat.money b { color: var(--gold); }
.clockbar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 3px; }
.clockbar i { display: block; height: 100%; background: var(--accent); width: 0; }

.goal { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.goal .ch { font-family: var(--f-disp); font-size: 12px; color: var(--accent); white-space: nowrap; }
.goal .gt { flex: 1; min-width: 0; font-size: 13px; }
.goal .gt b { font-weight: 600; }
.goal .gp { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* floor */
.floor { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 400px) { .floor { grid-template-columns: 1fr; } }
.room { border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-height: 140px; min-width: 0; border: 1px solid var(--line); }
.room.wait { background: var(--r-wait); } .room.ct { background: var(--r-ct); } .room.plan { background: var(--r-plan); } .room.treat { background: var(--r-treat); }
.room h3 { margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-family: var(--f-disp); font-weight: 400; font-size: 16px; }
.room h3 small { font-family: var(--f-body); font-size: 11px; color: var(--muted); text-align: right; }
.room h3 small.alert { color: var(--bad); font-weight: 600; }
.list { display: flex; flex-direction: column; gap: 6px; }
.empty { font-size: 12px; color: var(--muted); padding: 6px 0; }
.tok { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; cursor: pointer; min-width: 0; }
.tok.need { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.av { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-disp); font-size: 14px; color: #fff; }
.av.lung { background: #4a9fc2; } .av.prostate { background: #c78a3c; } .av.brain { background: #9a6fc4; }
.tinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tinfo b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tinfo b small { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 2px; }
.tinfo .st { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }
.pbar.pat i { background: var(--good); } .pbar.pat.low i { background: var(--bad); } .pbar.pat.mid i { background: var(--warn); }
.act { flex: none; border: 0; border-radius: 7px; padding: 6px 10px; font-size: 12.5px; font-weight: 600; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.act[hidden] { display: none; }

.log { list-style: none; margin: 0; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-size: 12.5px; display: flex; flex-direction: column; gap: 3px; }
.log li { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log li:first-child { color: var(--ink); }
.log time { font-variant-numeric: tabular-nums; margin-right: 6px; color: var(--muted); }
.fine { color: var(--muted); font-size: 11px; text-align: center; margin: 4px 0 0; }

/* toast */
.toasts { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 50; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { background: var(--ink); color: var(--bg); border-radius: 999px; padding: 7px 14px; font-size: 13px; max-width: 100%; animation: tin .2s ease-out; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* sheets */
.modal { position: fixed; inset: 0; z-index: 45; background: rgba(8, 14, 16, .5); display: flex; align-items: flex-end; justify-content: center;
  padding: 12px max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--panel); color: var(--ink); width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(18px); opacity: .5; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet, .toast { animation: none; } .pbar i { transition: none; } }
.sheet h2 { margin: 0; font-family: var(--f-disp); font-weight: 400; font-size: 21px; }
.sheet p { margin: 0; }
.muted { color: var(--muted); font-size: 13px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.btn { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 600; font-size: 15px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.wide { flex: 1; }

/* dialogue */
.talk { display: flex; gap: 12px; align-items: flex-start; }
.face { flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--f-disp); font-size: 22px; }
.talk .who { font-family: var(--f-disp); font-size: 15px; }
.talk .who small { font-family: var(--f-body); font-size: 11.5px; color: var(--muted); margin-left: 6px; }
.talk .line { font-size: 15.5px; margin-top: 4px; text-wrap: pretty; }
.next-hint { font-size: 11.5px; color: var(--muted); text-align: right; }

/* patient card */
.pcard { display: flex; gap: 12px; align-items: center; }
.pcard .av { width: 48px; height: 48px; font-size: 20px; }
.story { background: var(--r-wait); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choice button { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel); cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.choice button b { font-family: var(--f-disp); font-weight: 400; font-size: 16px; }
.choice button span { font-size: 12px; color: var(--muted); }
.choice button.main { border-color: var(--accent); background: var(--r-plan); }

/* shop */
.items { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.item div { flex: 1; min-width: 0; }
.item b { font-weight: 600; display: block; }
.item span { font-size: 12px; color: var(--muted); }
.item .price { font-family: var(--f-disp); color: var(--gold); white-space: nowrap; font-size: 15px; }

/* summary */
.sum { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.sum li { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.sum li:first-child { border-top: 0; }
.sum .pos { color: var(--good); } .sum .neg { color: var(--bad); }
.reviews { display: flex; flex-direction: column; gap: 6px; }
.review { font-size: 13px; background: var(--r-treat); border-radius: 10px; padding: 8px 10px; }
.review b { font-weight: 600; }

/* puzzle */
.pz { position: fixed; inset: 0; z-index: 35; background: var(--bg); overflow-y: auto;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.pz-in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.pz-head { display: flex; align-items: center; gap: 10px; }
.pz-head .t { flex: 1; min-width: 0; }
.pz-head .t b { font-family: var(--f-disp); font-weight: 400; font-size: 18px; display: block; }
.pz-head .t span { font-size: 12px; color: var(--muted); }
.viewer { position: relative; border-radius: 12px; overflow: hidden; background: var(--viewer); touch-action: none; }
.viewer canvas { display: block; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; cursor: crosshair; }
.vtip { position: absolute; left: 10px; right: 10px; bottom: 8px; color: #c8d3d2; font-size: 12px; pointer-events: none; text-shadow: 0 1px 2px #000; }
.tumorbar { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.tumorbar b { font-family: var(--f-disp); font-weight: 400; font-size: 15px; white-space: nowrap; }
.tumorbar .pbar { flex: 1; height: 8px; position: relative; }
.tumorbar .pbar i { background: var(--s-ptv); }
.tumorbar .pbar::after { content: ""; position: absolute; left: 95%; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.tumorbar em { font-style: normal; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
.organs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.organ { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0; }
.organ.m2 { border-color: var(--bad); }
.organ svg { width: 46px; height: 46px; }
.organ b { font-family: var(--f-disp); font-weight: 400; font-size: 14px; }
.organ small { font-size: 10.5px; color: var(--muted); }
.organ .say { font-size: 11.5px; min-height: 2.6em; display: flex; align-items: center; }
.organ .num { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.beamrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.dash { border-style: dashed; color: var(--accent); }
.chip:disabled { opacity: .4; cursor: default; }
.toggle { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.grade { font-family: var(--f-disp); font-size: 64px; line-height: 1; text-align: center; }
.grade.S, .grade.A { color: var(--good); } .grade.B { color: var(--accent); } .grade.C { color: var(--warn); } .grade.D { color: var(--bad); }
</style>

<div class="app">
  <header class="top">
    <div class="bar1">
      <div class="brand">햇살병원 방사선과<small id="dayline">1일차 · 09:00</small></div>
      <div class="speed" role="group" aria-label="게임 속도">
        <button id="sp0" aria-label="일시정지">II</button>
        <button id="sp1" aria-label="보통 속도">▶</button>
        <button id="sp2" aria-label="빠르게">▶▶</button>
      </div>
      <button class="iconbtn" id="shopbtn">상점</button>
    </div>
    <div class="stats">
      <div class="stat money"><span>자금</span><b class="tab" id="money"></b></div>
      <div class="stat"><span>평판</span><b class="tab" id="rep"></b></div>
      <div class="stat"><span>치료 완료</span><b class="tab" id="done"></b></div>
      <div class="stat"><span>근무 시간</span><b class="tab" id="clock"></b><div class="clockbar"><i id="clockfill"></i></div></div>
    </div>
    <div class="goal"><span class="ch" id="gch"></span><span class="gt" id="gtext"></span><span class="gp tab" id="gprog"></span></div>
  </header>

  <main class="floor" id="floor">
    <section class="room wait"><h3>대기실 <small id="h-wait">접수를 눌러 받아요</small></h3><div class="list" id="l-wait"></div></section>
    <section class="room ct"><h3>CT실 <small id="h-ct"></small></h3><div class="list" id="l-ct"></div></section>
    <section class="room plan"><h3>계획실 <small id="h-plan"></small></h3><div class="list" id="l-plan"></div></section>
    <section class="room treat"><h3>치료실 <small id="h-treat"></small></h3><div class="list" id="l-treat"></div></section>
  </main>

  <ul class="log" id="log" aria-live="polite"></ul>
  <p class="fine">교육·오락용 프로토타입입니다. 선량 계산은 단순화한 모델이며 임상과 무관합니다.</p>
</div>

<div class="toasts" id="toasts"></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<div class="pz" id="pz" hidden>
  <div class="pz-in">
    <div class="pz-head">
      <span class="av" id="pz-av"></span>
      <div class="t"><b id="pz-name"></b><span id="pz-sub"></span></div>
      <button class="iconbtn" id="pz-cancel">나가기</button>
    </div>
    <div class="viewer"><canvas id="pz-cv" aria-label="환자 단면 영상과 빛의 분포"></canvas><div class="vtip" id="pz-tip"></div></div>
    <div class="tumorbar"><b>종양 제압</b><div class="pbar"><i id="pz-cov"></i></div><em id="pz-covn"></em></div>
    <div class="organs" id="pz-organs"></div>
    <div class="beamrow" id="pz-beams"></div>
    <div class="btns">
      <span class="muted" id="pz-q" style="margin-right:auto;align-self:center"></span>
      <button class="btn" id="pz-ok">이 계획으로 치료</button>
    </div>
  </div>
</div>

<script>
// Units: cm. Image coords: x right = patient left, y down = posterior. Grid 32 x 24 cm at 0.4 cm.
const G = { x0: -16, y0: -12, d: 0.4, nx: 80, ny: 60 };
const N = G.nx * G.ny;
const RX = 60;
const ell = (cx, cy, a, b) => ({ cx, cy, a, b: b ?? a });
const inside = (s, x, y) => ((x - s.cx) / s.a) ** 2 + ((y - s.cy) / s.b) ** 2 <= 1;
const CASES = {
  lung: {
    label: '폐', body: ell(0, 0, 15, 10.5), iso: { x: -3.5, y: -0.5 }, ptvR: 2.2,
    tissues: [
      { s: ell(-7.2, -0.5, 5.6, 7.2), dens: 0.25, fill: 'lung' },
      { s: ell(7.4, -0.5, 5.0, 6.8), dens: 0.25, fill: 'lung' },
      { s: ell(2.6, -2.6, 4.2, 3.6), dens: 1, fill: 'soft' },
      { s: ell(0, 7.2, 1.9), dens: 1.6, fill: 'bone' },
      { s: ell(0, 6.8, 0.9), dens: 1, fill: 'soft' },
    ],
    oars: [
      { key: 'cord', name: '척수', who: '까칠이', in: [ell(0, 6.8, 0.9)], metric: 'max', lim: 45, color: 'cord',
        line: ['건드리기만 해봐', '조금 따끔한데?', '아 진짜 화났어'] },
      { key: 'lung', name: '폐', who: '숨숨이', in: [ell(-7.2, -0.5, 5.6, 7.2), ell(7.4, -0.5, 5.0, 6.8)], not: [ell(2.6, -2.6, 4.2, 3.6)], metric: 'v20', lim: 30, color: 'lung',
        line: ['숨쉬기 편해요', '좀 숨차요...', '헉헉, 못 버티겠어'] },
      { key: 'heart', name: '심장', who: '콩닥이', in: [ell(2.6, -2.6, 4.2, 3.6)], metric: 'mean', lim: 20, color: 'heart',
        line: ['두근두근 괜찮아', '심장 떨려요', '무서워요!'] },
    ],
  },
  prostate: {
    label: '전립선', body: ell(0, 0, 16, 11), iso: { x: 0, y: -0.3 }, ptvR: 2.3,
    tissues: [
      { s: ell(-9, 0.8, 2.3), dens: 1.6, fill: 'bone' },
      { s: ell(9, 0.8, 2.3), dens: 1.6, fill: 'bone' },
